[pytest]
pythonpath = . ./backend
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    eval: retrieval/generation eval harness (opt-in; default CI uses -m "not eval")
    integration: needs live services (Ollama, Redis, MongoDB, real LLM API); opt-in, default CI uses -m "not integration"

