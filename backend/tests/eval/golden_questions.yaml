  # ---------------------------------------------------------------- projects: Ordinals Lite, Litecoin Dev Kit, Litecoin Space (answer)
  # Grounded by the content/articles drafts and the litecoin.com/projects, LDK and ord-litecoin imports.
  - id: conceptual-ordinals
    category: conceptual
    query: What are Ordinals on Litecoin?
    expected_behavior: answer
    expected_source_substrings: [ordinal, litoshi]
    # The upstream ord docs are Bitcoin-worded; the answer must use Litecoin units.
    must_not_contain: ["subdivision of a bitcoin", "smallest subdivision of a bitcoin"]

  - id: conceptual-ldk
    category: conceptual
    query: What is the Litecoin Development Kit?
    expected_behavior: answer
    expected_source_substrings: [dev kit, descriptor, bdk]

  - id: conceptual-ldk-not-audited
    category: conceptual
    # The LDK docs call it a public prototype whose funds path is not independently reviewed.
    query: Is the Litecoin Dev Kit audited and ready for production wallets?
    expected_behavior: answer
    expected_source_substrings: [prototype, audit, dev kit]
    must_not_contain: ["is production-ready", "fully audited", "has been audited"]

