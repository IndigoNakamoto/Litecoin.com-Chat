    query: What is Litecoin Space?
    expected_behavior: answer
    expected_source_substrings: [litecoin space, mempool]

  - id: conceptual-stuck-tx
    category: conceptual
    # Definitional: must stay on RAG (the live mempool route is for "right now" phrasing).
    query: My Litecoin transaction has been unconfirmed for hours. How do RBF and CPFP help?
    expected_behavior: answer
    expected_source_substrings: [rbf, cpfp, replace-by-fee, child-pays-for-parent]

