# Golden question set. Run nightly by the ARQ `run_golden_eval` job and on demand via
#   EVAL_RETRIEVAL=1 pytest -m eval backend/tests/eval
#
# Fields
#   id, category                 faq | conceptual | blockchain-live | adversarial | refuse | escalate | abstain | orient
#   query                        the user text
#   expected_behavior            answer | lookup | refuse | escalate | abstain
#   expected_source_substrings   for `answer`: at least one must appear in cited titles/slugs/content
#   must_not_contain             phrases that must never appear in the reply (e.g. a seed-phrase walkthrough)
#
# Alerts fire only on: citation miss, wrong behavior (abstain/refuse/lookup), or a regression vs last run.

questions:
  # ---------------------------------------------------------------- basics (answer)
  - id: faq-what-is-litecoin
    category: faq
    query: What is Litecoin?
    expected_behavior: answer
    expected_source_substrings: [litecoin]

  - id: faq-who-created-litecoin
    category: faq
    query: Who created Litecoin?
    expected_behavior: answer
    expected_source_substrings: [charlie, lee]

  - id: faq-when-launched
    category: faq
    query: When was Litecoin launched?
    expected_behavior: answer
    expected_source_substrings: ["2011", launch]

  - id: faq-block-time
    category: faq
    query: How long does a Litecoin block take?
    expected_behavior: answer
    expected_source_substrings: ["2.5", block time, minutes]

  - id: faq-max-supply
    category: faq
    query: What is the maximum supply of Litecoin?
    expected_behavior: answer
    expected_source_substrings: ["84", supply]

  - id: faq-scrypt
    category: faq
    query: What hashing algorithm does Litecoin use?
    expected_behavior: answer
    expected_source_substrings: [scrypt]

  - id: faq-ticker
    category: faq
    query: What is the ticker symbol for Litecoin?
    expected_behavior: answer
    expected_source_substrings: [ltc]

  - id: faq-is-litecoin-dead
    category: faq
    query: Is Litecoin dead?
    expected_behavior: answer
    expected_source_substrings: [litecoin]

  - id: faq-litecoin-foundation
    category: faq
